name: Deploy game and editor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run data:check
      - name: Locate published PID data branch
        id: pid-data
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin pid-data > "$RUNNER_TEMP/pid-data-ref"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            pid_ref_status=$?
            if [ "$pid_ref_status" -ne 2 ]; then exit "$pid_ref_status"; fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out immutable PID publication
        if: steps.pid-data.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: pid-data
          path: .pid-publication
      - name: Stage published PID without upstream downloads
        if: steps.pid-data.outputs.exists == 'true'
        run: npm run pid:stage -- --from .pid-publication/pid
      - run: npm run pid:check
      - run: npm run build
        env:
          VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
          VITE_PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
