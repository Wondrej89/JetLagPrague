name: Test and deploy game, editor and simulator to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_MULTIPLAYER_URL: ${{ vars.MULTIPLAYER_URL || 'https://jetlag-prague-multiplayer.wondrej-blogspot.workers.dev' }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:multiplayer
      - run: npm run data:check
      - name: Locate published PID data branch
        id: pid-data
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin pid-data > "$RUNNER_TEMP/pid-data-ref"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            pid_ref_status=$?
            if [ "$pid_ref_status" -ne 2 ]; then exit "$pid_ref_status"; fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out immutable PID publication
        if: steps.pid-data.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: pid-data
          path: .pid-publication
      - name: Stage published PID without upstream downloads
        if: steps.pid-data.outputs.exists == 'true'
        run: npm run pid:stage -- --from .pid-publication/pid
      - name: Verify the deployed game release uses the current pid-data snapshot
        env:
          PID_BRANCH_EXISTS: ${{ steps.pid-data.outputs.exists }}
        run: |
          if [ "$PID_BRANCH_EXISTS" != true ]; then
            echo "::error::Chybí větev pid-data. Spusťte Update PID and game catalog."
            exit 1
          fi
          npm run release:pid:check -- .pid-publication/pid
      - run: npm run pid:check
      - run: npm run build
        env:
          VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
          VITE_PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
      - name: Verify alignment in the final Pages artifact
        run: npm run release:pid:check -- dist/site/editor/pid dist/site/releases
      - name: Verify the live multiplayer endpoint accepts Pages
        id: multiplayer-status
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const origin = 'https://wondrej89.github.io';
          const base = process.env.VITE_MULTIPLAYER_URL.replace(/\/$/, '');
          const response = await fetch(`${base}/status`, { headers: { Origin: origin }, signal: AbortSignal.timeout(15000) });
          if (!response.ok || response.headers.get('Access-Control-Allow-Origin') !== origin) {
            throw new Error(`Multiplayer status returned HTTP ${response.status} or a different CORS origin.`);
          }
          const status = await response.json();
          if (status.configured !== true) throw new Error('The multiplayer Worker is waiting for configuration.');
          appendFileSync(process.env.GITHUB_OUTPUT, `fixed_medium=${status.size === 'medium'}\n`);
          JS
      - name: Cloudflare reports fixed Medium
        if: steps.multiplayer-status.outputs.fixed_medium == 'true'
        run: echo 'The production Worker enforces Medium.'
      - name: Select E2E Chromium
        shell: bash
        run: |
          # Hosted Ubuntu already includes Chrome and its native dependencies.
          # Avoid an unnecessary browser/apt download blocking Pages deployment.
          e2e_browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -n "$e2e_browser" ]; then
            "$e2e_browser" --version
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$e2e_browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: E2E against the exact Pages artifact
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_BUILD: '1'
      - name: Two-phone multiplayer E2E
        run: npm run test:multiplayer:e2e
        env:
          CI: 'true'
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
