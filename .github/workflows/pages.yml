name: Deploy editor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run data:check
      - name: Refresh and verify PID publication
        run: npm run pid:publish
        env:
          PID_PUBLISHED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Preserve PID refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pid-refresh-diagnostics
          path: data/reports/pid-refresh.json
          if-no-files-found: ignore
      - run: npm run pid:check
      - run: npm run build
        env:
          VITE_MAPY_API_KEY: ${{ secrets.VITE_MAPY_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
