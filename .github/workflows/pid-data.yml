name: Update PID and game catalog
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      service_date:
        description: 'Pro ostré vydání dnešní pražský den YYYY-MM-DD. Prázdné = automaticky.'
        required: false
        type: string
      force:
        description: 'Zpracovat znovu i při existenci ověřeného snapshotu tohoto dne'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: write
concurrency:
  group: pid-data-update
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.PID_DAILY_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx vitest run packages/geo-core/src/pid-gtfs.test.ts scripts/gtfs-publication.test.ts
        working-directory: app
      - name: Locate data branch
        id: data-branch
        working-directory: app
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin pid-data > "$RUNNER_TEMP/pid-data-ref"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            pid_ref_status=$?
            if [ "$pid_ref_status" -ne 2 ]; then exit "$pid_ref_status"; fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out data publication
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.data-branch.outputs.exists == 'true' && 'pid-data' || 'main' }}
          path: publication
      - name: Initialize isolated data branch
        if: steps.data-branch.outputs.exists != 'true'
        shell: bash
        run: |
          git -C publication checkout --orphan pid-data
          git -C publication rm -rf .
          mkdir -p publication/pid
          cp -a app/apps/editor/public/pid/. publication/pid/
      - name: Build or reuse verified GTFS snapshot
        working-directory: app
        run: npm run pid:gtfs -- --output "$GITHUB_WORKSPACE/publication/pid"
        env:
          PID_SERVICE_DATE: ${{ inputs.service_date }}
          PID_FORCE_REFRESH: ${{ inputs.force }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build, validate and check the replacement game release
        working-directory: app
        run: |
          npm run release:pid:refresh -- "$GITHUB_WORKSPACE/publication/pid"
          npm run release:pid:check -- "$GITHUB_WORKSPACE/publication/pid"
          npm run release:check
      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pid-gtfs-diagnostics
          path: |
            app/data/reports/pid-gtfs-refresh.json
            app/data/reports/game-release-pid.json
          if-no-files-found: ignore
      - name: Publish PID and game catalog in one atomic push
        shell: bash
        run: |
          git -C publication add -- pid
          git -C app add -- data/releases
          if git -C publication diff --cached --quiet && git -C app diff --cached --quiet; then
            exit 0
          fi
          for tree in app publication; do
            git -C "$tree" config user.name 'github-actions[bot]'
            git -C "$tree" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          done
          # Advance both refs even when reusing one side. Both old tips then participate in the atomic update.
          git -C publication commit --allow-empty -m 'Synchronize verified PID snapshot'
          git -C app commit --allow-empty -m 'Synchronize game release with verified PID'
          git -C app fetch --no-tags --update-shallow "$GITHUB_WORKSPACE/publication" HEAD:refs/jetlag/pid-candidate
          git -C app push --atomic origin HEAD:refs/heads/main refs/jetlag/pid-candidate:refs/heads/pid-data
      - name: Deploy web with published data
        working-directory: app
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
